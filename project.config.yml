# Starter project.config.yml for a Node/TypeScript/pnpm stack.
# Copied verbatim into a new consuming repo by `node scripts/scaffold.mjs
# --template node-pnpm` when that repo has no project.config.yml yet.
# Edit every value below for your actual repo before your first task —
# this is a starting point, not a finished config. In particular:
# team.*, tiers.C_needs_reviewer, and ticket_source.* are almost
# certainly wrong for your repo as shipped.
version: 1

team:
  name: "new-dev"
  git_remote: "git@github.com:Aayush-Puri-CTS/admin-rep-directory-poc-fe.git"
  branch_prefixes:
    feature: "feat/"
    bug: "bug/"
    chore: "chore/"
    hotfix: "hotfix/"

stack:
  package_manager: "pnpm"
  lint_cmd: "pnpm exec eslint {file}"
  test_cmd: "pnpm exec jest --testPathPattern {base}"
  extra_validate_cmd: "pnpm exec tsc --noEmit"
  flags:
    no_install: true

verify_hook:
  include_glob: "src/**/*.ts"
  test_pattern: "{base}.test.ts"
  skip_globs:
    - "**/*.md"
    - "**/dist/**"
    - "**/node_modules/**"
  loop_budget: 3

hard_rules:
  - id: "no-live-data"
    statement: "No connections to live/production endpoints or databases."
    audit: static
    review_gate: blocking
  - id: "no-pii-in-logs"
    statement: "No PII or sensitive account details written to analytics or console logs."
    audit: verifier
    review_gate: blocking

tiers:
  D_triggers:
    - "public API contract change"
    - "database schema or migration modification"
    - "authentication, authorization, or tenant-isolation changes (e.g. JWT verification, Keycloak realm/mapper config, RLS)"
    - "new or changed DTO shapes or shared domain type values (e.g. new RepType/RepStatus/RepPlatform values, tenant-manifest schema)"
    - "cross-cutting architectural changes (new module boundaries, state-management or data-fetching pattern changes, new external service integrations)"
    - "build, bundling, or dependency-graph changes that affect runtime architecture"
  E_triggers:
    - "production environment secrets or deployment key modification"
    - "production deployment or release promotion (deploying the Lambda authorizer, publishing packages, cutting a prod release)"
    - "infrastructure-as-code changes targeting production (AWS CDK, API Gateway, IAM roles/policies)"
    - "modification of CI/CD credentials, cloud access keys, or signing/certificate material"
  C_needs_reviewer: "new-dev-team-lead"

permissions:
  deny_read:
    - ".env*"
    - "**/secrets/**"
    - "**/*.pem"
  deny_cmd_patterns:
    - "pnpm publish"
    - "npm publish"
    - "rm -rf /"
  ask_cmd_patterns:
    - "git commit"
    - "git push"
    - "gh pr create"
  ask_write_paths:
    - "**/package.json"
    - "**/.github/workflows/**"
  allow_write_paths:
    - "src/**"

ticket_source:
  type: "manual"

# Governance labels applied to every PR the Coordinator opens. "ai-assisted"
# is mandatory (enforced by scripts/validate-config.mjs); add more freely.
pull_request:
  required_labels:
    - "ai-assisted"

observability:
  enabled: false
